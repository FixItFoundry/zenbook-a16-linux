# This profile is activated only by A16 hardware setup. Other installed kernels
# retain their own initramfs behavior. The shared kernel declares its audited ABI.
a16_supported=0
case "${KERNELVERSION:-}" in
  7.2.10-omarchy-a16-*) a16_supported=1 ;;
  *)
    if [[ -r /usr/lib/modules/${KERNELVERSION:-}/omarchy-a16-dsp-abi ]]; then
      read -r a16_abi < "/usr/lib/modules/$KERNELVERSION/omarchy-a16-dsp-abi"
      [[ $a16_abi != 1 ]] || a16_supported=1
    fi
    ;;
esac
if (( a16_supported )); then
    a16_hooks=()
    a16_inserted=0
    for a16_hook in "${HOOKS[@]}"; do
      [[ $a16_hook == omarchy-a16-dsp ]] && continue
      a16_hooks+=("$a16_hook")
      if [[ $a16_hook == udev ]]; then
        a16_hooks+=(omarchy-a16-dsp)
        a16_inserted=1
      fi
    done
    if (( ! a16_inserted )); then
      echo 'A16 early DSP startup requires the BusyBox udev initramfs profile' >&2
      return 1
    fi
    HOOKS=("${a16_hooks[@]}")
    unset a16_hooks a16_hook a16_inserted
fi
unset a16_supported a16_abi
