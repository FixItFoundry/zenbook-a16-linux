# GLYMUR / ASUS Zenbook A16 (UX3607OA)
#
# History: this file replaces 99-glymur-no-suspend.conf (2026-07-29 22:13), which
# set every handler to ignore because suspend hard-reset the SoC. That was never
# documented anywhere and it silently blocked the first suspend test on
# 2026-07-30 ("Unit suspend.target is masked, refusing operation").
#
# Suspend now works, but ONLY on the "Fedora Linux on ARM (suspend capable)"
# GRUB entry, which carries glymur_pci_skip=5. Root cause: PCI config-space
# access during dpm_suspend_noirq hard-resets this SoC; that knob skips
# pci_save_state() and pci_prepare_to_sleep(). See docs/modifications.md.
#
# ⚠️ On ANY OTHER entry these handlers will hard-reset the machine on lid close
#    or a power-button press. The suspend-capable entry is the GRUB default.
#
# ⚠️ Validated on 2 suspend/resume cycles only. It is a workaround, not a fix:
#    PCI devices stay powered, so it saves less power than a correct suspend.

[Login]

# Lid close suspends. Docked is deliberately left alone so closing the lid with
# an external display attached does not sleep the machine.
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Power button suspends rather than powering off. A long press still forces a
# hardware power-off, so nothing is lost. Previously "poweroff", which was an
# active hazard during suspend testing: the power button is also the wake
# source, so a press to wake the machine powered it off instead and looked
# exactly like a failed resume.
HandlePowerKey=suspend
HandleSuspendKey=suspend

# No hibernate: there is no RTC wake alarm on this platform (qcom,no-alarm), and
# hibernate.target / hybrid-sleep.target / suspend-then-hibernate.target remain
# masked.
HandleHibernateKey=ignore

# Idle does NOT auto-suspend. Deliberate: lid and button are user-initiated, so
# a bad resume is observed; an idle suspend would fire unattended. Revisit once
# suspend has more cycles behind it.
IdleAction=ignore
