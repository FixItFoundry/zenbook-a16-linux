# ADSP firmware must be reachable when qcom_q6v5_pas probes at ~t+1.5s, because
# remoteproc does NOT retry a failed request_firmware(). The firmware lives on the
# root filesystem, which is not mounted until ~t+2.5s, so without this the ADSP
# stays offline all session -> q6prmcc never registers -> lpass pinctrl never gets
# clk 'core' -> the whole audio stack (2x soundwire, 3x codec, sound card) is stuck
# in deferred probe.
#
# Earlier attempt (omit_drivers+=" qcom_q6v5_pas ") fixed that by loading the driver
# after switch-root, but it pushed ADSP boot to t+5.3s and card registration to
# t+11.4s -- only ~0.8s before PipeWire starts, which then hits EINVAL opening the
# PCMs and gives up. Shipping the firmware instead keeps ADSP boot at ~t+1.5s and
# restores the historical timing margin.
install_items+=" /lib/firmware/qcom/glymur/ASUSTeK/UX3607OA/qcadsp8480.mbn /lib/firmware/qcom/glymur/ASUSTeK/UX3607OA/adsp_dtbs.elf /lib/firmware/qcom/glymur/ASUSTeK/UX3607OA/adspr.jsn /lib/firmware/qcom/glymur/ASUSTeK/UX3607OA/adspua.jsn "
