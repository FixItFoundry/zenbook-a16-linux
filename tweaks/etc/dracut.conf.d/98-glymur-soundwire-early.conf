# SoundWire and the WSA8845 speaker stack probe in the initramfs on this board.
# Keep the matching AudioReach topology there as well: qcom-apm can request it
# before /sysroot is mounted and does not retry a failed card probe later.
add_drivers+=" soundwire_bus soundwire_qcom regmap_sdw snd_soc_wsa884x
	snd_soc_lpass_wsa_macro snd_soc_lpass_va_macro snd_soc_lpass_macro_common
	snd_soc_qcom_sdw snd_soc_qcom_common snd_soc_x1e80100 snd_soc_hdmi_codec
	snd_soc_core snd_pcm snd_pcm_dmaengine snd_compress snd_timer snd_seq
	snd_seq_device snd_seq_dummy snd_hrtimer snd_ctl_led snd
	q6prm q6prm_clocks q6apm_dai q6apm_lpass_dais snd_q6apm snd_q6dsp_common apr "
install_items+=" /usr/lib/firmware/qcom/glymur/GLYMUR-ASUS-Zenbook-A16-UX3607OA-tplg.bin "
