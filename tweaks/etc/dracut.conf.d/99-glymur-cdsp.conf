# CDSP firmware must be in the initramfs for the same reason as the ADSP (99-glymur-adsp.conf):
# qcom_q6v5_pas auto-boots the CDSP at probe (~t+2.7s, before switch-root) and remoteproc
# does not retry a failed request_firmware(), so without these the CDSP stays offline all session.
install_items+=" /lib/firmware/qcom/glymur/ASUSTeK/UX3607OA/qccdsp8480.mbn /lib/firmware/qcom/glymur/ASUSTeK/UX3607OA/cdsp_dtbs.elf "
