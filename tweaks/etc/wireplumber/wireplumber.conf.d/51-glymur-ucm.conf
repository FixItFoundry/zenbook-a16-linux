monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*Speaker.*" } ]
    actions = { update-props = {
      session.suspend-timeout-seconds = 2
      audio.channels = 4
      audio.position = [ FL FR RL RR ]
      channelmix.upmix = true
      channelmix.upmix-method = simple
    } }
  }
  {
    # Release ADSP DisplayPort audio graph quickly when switching between DP/HDMI ports
    matches = [ { node.name = "~alsa_output.platform-sound.*HDMI.*" } ]
    actions = { update-props = {
      session.suspend-timeout-seconds = 1
    } }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-sound.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 5 } }
  }
]
