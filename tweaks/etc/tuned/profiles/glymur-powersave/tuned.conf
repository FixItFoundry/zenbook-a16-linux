#
# Glymur A16 powersave profile.
#
# Inherits the stock Fedora "powersave" profile and adds per-cluster CPU
# frequency caps, which the stock profiles cannot express: their [cpu] plugin
# knob (max_perf_pct) is intel_pstate-only, and this machine runs scmi-cpufreq.
#
# The caps are applied by a script rather than a [sysfs] block because ordering
# matters -- boost has to be set before scaling_max_freq, since enabling boost
# is what raises cpuinfo_max_freq to the top boost bin, and a max-freq write
# above the current ceiling gets clamped.
#
[main]
summary=Glymur A16 - powersave: clusters capped deep in the flat part of the cost curve
include=powersave

[script]
script=${i:PROFILE_DIR}/script.sh
