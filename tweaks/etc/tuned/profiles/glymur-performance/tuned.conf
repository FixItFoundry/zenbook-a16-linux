#
# Glymur A16 performance profile.
#
# Inherits the stock Fedora "throughput-performance" profile and adds per-cluster CPU
# frequency caps, which the stock profiles cannot express: their [cpu] plugin
# knob (max_perf_pct) is intel_pstate-only, and this machine runs scmi-cpufreq.
#
# The caps are applied by a script rather than a [sysfs] block because ordering
# matters -- boost has to be set before scaling_max_freq, since enabling boost
# is what raises cpuinfo_max_freq to the top boost bin, and a max-freq write
# above the current ceiling gets clamped.
#
[main]
summary=Glymur A16 - performance: all three clusters open, boost bins enabled
include=throughput-performance

# Stock throughput-performance sets governor=performance, which pins every core
# at its ceiling even while idle -- a real battery cost on a laptop for no gain
# in peak. schedutil reaches the same peak on demand: fast_switch is active on
# this platform (no sugov kthreads) and the transition latency is 30 us. Flip
# this to "performance" if you want guaranteed pinned clocks.
[cpu]
governor=schedutil

[script]
script=${i:PROFILE_DIR}/script.sh
